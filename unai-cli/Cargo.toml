[package]
name = "unai-cli"
version = "0.2.4"
edition = "2021"
description = "UnAI — a workspace-oriented runtime for autonomous AI agents (infrastructure CLI)"
license = "MIT"
default-run = "unai"

[[bin]]
name = "unai"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.11"
toml = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
colored = "3"