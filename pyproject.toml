[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unai"
version = "0.0.1"
description = "UnAI — a workspace-oriented runtime for autonomous AI agents"
requires-python = ">=3.11"
# MCP server (`unai serve`) uses FastMCP from the `mcp` package.
# NOTE: mcp>=2.0 removed `mcp.server.fastmcp` — pin <2.
dependencies = ["mcp>=1.0,<2", "websockets>=12.0"]

[tool.setuptools.packages.find]
where = ["src"]
