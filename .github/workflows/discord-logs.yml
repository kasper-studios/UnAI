name: Discord Logs

on:
  push:
  pull_request:
    types: [opened, closed, reopened, synchronize]
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published, created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send event to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action || '' }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event.issue.title || github.event.release.name || '' }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.event.pull_request.user.login || github.event.issue.user.login || github.event.release.author.login || github.actor }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set, skipping"
            exit 0
          fi

          # Determine icon, color and title per event type
          case "$EVENT" in
            push)
              ICON="🔨"; COLOR=3066993; TITLE="Push to ${REF#refs/heads/}"
              URL="https://github.com/$REPO/commit/$SHA"
              ;;
            pull_request)
              case "$ACTION" in
                opened)   ICON="📥"; COLOR=15105570; TITLE="PR opened: #${{ github.event.number }}" ;;
                closed)   if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                            ICON="✅"; COLOR=3066993; TITLE="PR merged: #${{ github.event.number }}"
                          else
                            ICON="🗑"; COLOR=10070709; TITLE="PR closed: #${{ github.event.number }}"
                          fi ;;
                reopened) ICON="♻️"; COLOR=15105570; TITLE="PR reopened: #${{ github.event.number }}" ;;
                synchronize) ICON="🔄"; COLOR=15105570; TITLE="PR updated: #${{ github.event.number }}" ;;
                *) ICON="🔀"; COLOR=15105570; TITLE="PR: #${{ github.event.number }}" ;;
              esac
              URL="https://github.com/$REPO/pull/${{ github.event.number }}"
              ;;
            issues)
              case "$ACTION" in
                opened)   ICON="🐛"; COLOR=15105570; TITLE="Issue opened: #${{ github.event.issue.number }}" ;;
                closed)   ICON="✅"; COLOR=3066993; TITLE="Issue closed: #${{ github.event.issue.number }}" ;;
                reopened) ICON="♻️"; COLOR=15105570; TITLE="Issue reopened: #${{ github.event.issue.number }}" ;;
                *) ICON="📋"; COLOR=15105570; TITLE="Issue: #${{ github.event.issue.number }}" ;;
              esac
              URL="https://github.com/$REPO/issues/${{ github.event.issue.number }}"
              ;;
            release)
              ICON="🚀"; COLOR=15158332; TITLE="Release: ${{ github.event.release.tag_name }}"
              URL="${{ github.event.release.html_url }}"
              ;;
            *)
              ICON="📡"; COLOR=10181046; TITLE="Event: $EVENT"
              URL="https://github.com/$REPO"
              ;;
          esac

          jq -n \
            --arg icon "$ICON" \
            --arg title "$TITLE" \
            --arg desc "$MSG" \
            --arg url "$URL" \
            --arg repo "$REPO" \
            --arg author "$AUTHOR" \
            --argjson color "$COLOR" \
            '{username:"UnAI GitHub", embeds:[{title:($icon + " " + $title), description:$desc, url:$url, color:$color, fields:[{name:"Repo", value:$repo, inline:true},{name:"Author", value:$author, inline:true}]}]}' \
            > payload.json

          curl -sf -H "Content-Type: application/json" \
            -d @payload.json "$WEBHOOK_URL" \
            || echo "::warning::Discord webhook request failed"
